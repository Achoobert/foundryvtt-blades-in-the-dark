  # Prison grid is 3 columns. List order is the turf slot. The sheet breaks
  # rows after slots 3 and 6; slot 4 is the Prison / base.
  # connects draws connector lines: left, right, top, bottom.
  turfs:
    - name: Smuggling
      description: "+2 load in prison, & can carry stacks, +2d to Doing Time"
      connects: [right, bottom]
    - name: Contraband
      description: "Can now Indulge Vice inside prison, +1d to Doing Time"
      connects: [right, bottom]
    - name: Cell Block Control
      description: "No more Survival rolls, +2d to Doing Time rolls"
      connects: [left]
      # row
    - name: Prison
      description: base 
      connects: [right, bottom, top]
    - name: Hardcase
      description: "Mark turf box on crew’s Rep tracker"
      connects: [right, bottom]
    - name: Outside Claim
      description: "Take a claim for the crew"
      connects: [left]
    # row
    - name: Guard Payoff
      description: "+1d to all rolls inside prison, +1d to Doing Time"
      connects: [rightw]
    - name: Smuggling
      description: "+2 load in prison, & can carry stacks, +1d to Doing Time"
      connects: [right] 
    - name: Parloe Infulence
      description: "Wanted Level counts as one lower for sentence"
      connects: [left]
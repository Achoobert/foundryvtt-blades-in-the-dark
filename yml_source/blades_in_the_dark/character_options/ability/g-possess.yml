name: (G) Possess
type: ability
system:
  description: >-
    You may attune to the ghost field in order to take control of a living body. When your control is challenged, you
    must re-attune (risking electroplasmic harm) or leave the body. Your control is challenged when: you consume spirit
    energy from the host—when arcane powers act against you—when the host's will is driven to desperation. You may
    easily and indefinitely possess a hull or hollow which has been ritually prepared for you (change your playbook to
    Hull or Vampire, respectively).

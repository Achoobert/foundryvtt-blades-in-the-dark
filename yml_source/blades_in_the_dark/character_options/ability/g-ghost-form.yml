name: (G) Ghost Form
type: ability
system:
  description: >-
    You are now a concentration of electroplasmic vapor which resembles your living body and clothes. You may weakly
    interact with the physical world and vice versa. You're vulnerable to arcane powers and electroplasmic effects. You
    move about by floating and may fly swiftly without tiring. You may slowly flow through small openings as a vapor.
    You chill the area around you and are terrifying for the living to behold. You are affected by spiritbane charms
    (take 2 drain to overcome the repulsion). Whenever you would take stress, take drain instead. When you would take
    trauma, take gloom instead.

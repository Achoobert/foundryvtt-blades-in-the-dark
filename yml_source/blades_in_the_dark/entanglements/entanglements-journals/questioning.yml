name: Questioning
content: >-
  <p>The Bluecoats grab an NPC member of your crew or one of the crew’s contacts, to question them about your crimes.
  Who do the Bluecoats think is most vulnerable? Make a <strong>fortune roll</strong> to see how much they talk
  (<strong>1-3: +2 heat, 4/5: +1 heat</strong>), or pay the Bluecoats off with<strong> 2 coin</strong>.</p>

  <p><em>Roll 2d for a normal person to see how well they keep quiet. If they’re an experienced underworld type or some
  kind of tough, give them 3d or 4d instead. If they’re soft or if they have some loyalty to the law, give them 1d or
  0d.</em></p>

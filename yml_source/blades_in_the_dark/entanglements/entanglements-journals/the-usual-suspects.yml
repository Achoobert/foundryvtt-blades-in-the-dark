name: The Usual Suspects
content: >-
  <p>The Bluecoats grab someone in the periphery of your crew. One player volunteers a friend or vice purveyor as the
  person most likely to be taken. Make a <strong>fortune roll</strong> to find out if they resist questioning
  (<strong>1-3: +2 heat, 4/5: level 2 harm</strong>), or pay the Bluecoats off with<strong> 1 coin</strong>.</p>

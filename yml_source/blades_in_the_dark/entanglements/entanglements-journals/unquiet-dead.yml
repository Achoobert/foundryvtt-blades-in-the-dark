name: Unquiet Dead
content: >-
  <p>A rogue spirit is drawn to you—perhaps it’s a past victim? Acquire the services of a Whisper or Rail Jack to
  attempt to destroy or banish it, or deal with it yourself.</p>

  <p><em>They can hire an NPC by using the acquire asset downtime activity (see page </em><em>153). Roll the NPC’s
  quality level as a fortune roll to see how well they deal </em><em>with the spirit.</em></p>

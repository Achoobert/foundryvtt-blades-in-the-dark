name: Gang Trouble
content: >-
  <p>One of your gangs (or other cohorts) causes trouble due to their flaw(s). You can lose face (forfeit rep equal to
  your Tier +1), make an example of one of the gang members, or face reprisals from the wronged party.</p>

  <p><em>After the PCs succeed at their assault and wipe out the Red Sashes, their savage </em><em>gang takes things too
  far. They start attacking any Iruvians they see in Crow’s </em><em>Foot, and during one brawl, they horribly maim a
  citizen. Everyone’s talking </em><em>about it. Is this how the Bloodletters run their crew? Arcy decides to handle
  </em><em>matters by making an example of one of the gang. She takes them back to the </em><em>tavern where the
  incident happened, and smashes the offending thug’s face </em><em>into the bar, giving her a horrific scar.</em></p>

  <p><em>The GM thinks this treatment warrants a tick on a progress clock they created </em><em>in an earlier session
  when Arcy treated the gang roughly. The clock is called </em><em>“The Gang Fights Back.” It was already at three out
  of four segments, so now </em><em>it’s full! Looks like Arcy’s rough treatment of the savage gang is gonna come
  </em><em>back to bite her.</em></p>

name: Flipped
content: >-
  <p>One of the PCs’ rivals arranges for one of your contacts, patrons, clients, or a group of your customers to switch
  allegiances due to the heat on you. They’re loyal to another faction now.</p>

  <p><em>You hear word on the street that Laroze is working for the Billhooks now. He </em><em>was seen talking to Flint
  the other day... that bastard is probably behind it. </em><em>Remove Laroze as a contact until you can get that sorted
  out.</em></p>

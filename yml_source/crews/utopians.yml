name: Utopians
type: crew_type
img: icons/svg/city.svg
system:
  description: A NEW AGE CULT DEDICATED TO AN UNSETTLING VISION OF THE FUTURE
  experience_clues: You advanced the realization of your Utopian Vision.
  # List order is the turf slot: item 1 becomes system.turfs."1". The crew sheet
  # grid breaks rows after slots 5, 10, and 15; slot 18 is the Base / lair.
  # connects draws connector lines: left, right, top, bottom.
  turf_headers:
    - name: First Circle
      select: 2
      subheader: Choose two truths of the Vision
      options: [Free, Egalitarian, Abundant, Beautiful, Serene, Radiant, Natural]
    - name: Second Circle
      unlock: "Threshold of Gold: Circle unlocks when the crew has earned 20 stacks total"
      select: 2
      subheader: Learn a new truth of the Vision
      options: [Shifting, Sweltering, Lustful, Unsettling, Future, Past, Alien]
    - name: Third Circle
      unlock: "Threshold of Blood: Circle unlocks when the crew has also ended at least 10 lives"
      select: 1
      subheader: Learn a new truth of the Vision
      options: [Psychedelic, Inhuman, Violent, Future, Past, Tempestuous]
    - name: Final Circle
      unlock: "Threshold of Power: Unlocks when the crew reaches Tier 3 and created a major anomaly."
      select: 1
      subheader: Learn a new truth of the Vision
      options: [Fiery, Frozen, Terrifying, Cruel, Monstrous, Capricious, Inhuman]
  turfs:

      description: +1d engagement for stealth approaches
      connects: [right, bottom]
    - name: Legendary Target
      description: Tier 5 target, 15 Rep, 10 stacks (one-off opportunity)
      connects: [right]
      highlight: true 
    - name: Double Contract
      description: Legendary Target includes second hit, for +10 bonus stacks
      connects: [right]
      highlight: true 
    - name: Cover Identities
      description: +1d engagement for deception and social approaches
